<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Forgot Password - CV for U</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/auth.css">
  <link rel="stylesheet" href="css/cv.css">
</head>

<body class="auth-body">
  <main class="auth-container">
    <img src="images/logo.png" alt="CV for U" style="width:90px; margin-bottom:14px;">
    <h1>Reset your password</h1>
    <p class="form-sub">Enter your email or username and we'll send you a password reset link.</p>

    <form id="forgotPasswordForm">
      <div class="form-group">
        <label>Email or username</label>
        <input type="text" id="forgotIdentifier" autocomplete="username" required>
      </div>

      <p id="forgotMessage" class="form-message"></p>
      <p id="forgotDebug" class="form-message success"></p>

      <button type="submit" class="auth-btn">Send reset link</button>
    </form>

    <div class="auth-alt">
      <p><a href="login.html">Back to login</a></p>
    </div>
  </main>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
