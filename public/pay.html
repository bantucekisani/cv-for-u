<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Payment - CV for U</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="css/cv.css" />
  <style>
    .link-btn {
      background: none;
      border: none;
      color: #6b7280;
      margin-top: 14px;
      cursor: pointer;
      font-size: 14px;
    }
    .link-btn:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>
  <div class="pay-container">
    <h1 id="payTitle">Unlock your CV downloads</h1>

    <p id="payDescription">
      Pay once to unlock 4 CV PDF downloads and 1 AI cover letter for this CV.
    </p>

    <h2 id="payAmount">R40.00</h2>

    <button id="payBtn" class="primary-btn">Pay with PayFast</button>
    <button id="cancelPayBtn" class="secondary-btn">Cancel</button>

    <p id="payError" style="color:red; margin-top:12px;"></p>
    <p class="secure">Secure payment via PayFast</p>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const type = params.get("type");
    const cvId = params.get("cv");

    window.PAY_CV_ID = cvId;
    window.PAY_TYPE = type === "cover-letter" ? "cover-letter" : "cv";
    window.PAY_AMOUNT = window.PAY_TYPE === "cover-letter" ? 25 : 40;

    const titleEl = document.getElementById("payTitle");
    const descEl = document.getElementById("payDescription");
    const amountEl = document.getElementById("payAmount");

    if (window.PAY_TYPE === "cover-letter") {
      titleEl.textContent = "Unlock 1 AI cover letter";
      descEl.textContent =
        "Pay once to unlock 1 AI-generated cover letter download for this CV.";
      amountEl.textContent = "R25.00";
    }

    document.getElementById("cancelPayBtn")?.addEventListener("click", () => {
      if (cvId) {
        window.location.replace(`create-cv.html?id=${cvId}`);
      } else {
        window.location.replace("dashboard.html");
      }
    });
  </script>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/pay.js?v=20260410"></script>
</body>
</html>
