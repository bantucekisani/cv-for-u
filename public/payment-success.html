<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Payment Successful</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
  <meta http-equiv="Pragma" content="no-cache">
</head>

<body style="font-family:system-ui;text-align:center;padding:40px">
  <h1>Payment Successful</h1>
  <p>Redirecting you back to your CV...</p>

  <script>
    (async function () {
      const params = new URLSearchParams(window.location.search);
      const cvId = params.get("cv");
      const type = params.get("type");

      if (!cvId) {
        window.location.replace("dashboard.html");
        return;
      }

      let storedUser = null;
      try {
        storedUser = JSON.parse(localStorage.getItem("user") || "null");
      } catch {
        storedUser = null;
      }
      const token = storedUser?.token || localStorage.getItem("token") || "";

      if (cvId) {
        localStorage.setItem("forceReloadCv", cvId);
      }

      async function waitForCredits() {
        if (!token) {
          return;
        }

        const needsCoverCredit = type === "cover-letter";
        const deadline = Date.now() + 20000;

        while (Date.now() < deadline) {
          try {
            const res = await fetch(`/api/cv/${cvId}`, {
              headers: {
                Authorization: `Bearer ${token}`
              }
            });
            const data = await res.json().catch(() => ({ success: false }));
            const cv = data?.cv || null;

            if (res.ok && data?.success && cv) {
              const hasNeededCredits = needsCoverCredit
                ? Number(cv.coverLettersRemaining || 0) > 0
                : Number(cv.downloadsRemaining || 0) > 0;

              if (hasNeededCredits) {
                return;
              }
            }
          } catch {}

          await new Promise(resolve => setTimeout(resolve, 2000));
        }
      }

      if (type === "cover-letter" && token) {
        try {
          await fetch(`/api/payfast/confirm-cover/${cvId}`, {
            headers: {
              Authorization: `Bearer ${token}`
            }
          });
        } catch (err) {
          console.warn("Cover letter confirm failed, reload will retry.");
        }
      }

      await waitForCredits();

      window.location.replace(`create-cv.html?id=${cvId}&v=20260410`);
    })();
  </script>
</body>
</html>
