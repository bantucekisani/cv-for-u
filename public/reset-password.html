<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Set New Password - CV for U</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/cv.css">
  <link rel="stylesheet" href="css/auth.css">
</head>

<body class="auth-body">
  <main class="auth-card">
    <a href="login.html" class="auth-back">Back to login</a>
    <img src="images/logo.png" alt="CV for U" class="auth-logo">
    <p class="auth-eyebrow">CV for U</p>
    <h1>Create a new password</h1>
    <p class="form-sub">Choose a secure password for your account.</p>

    <form id="resetPasswordForm">
      <div class="form-group">
        <label>New password</label>
        <input type="password" id="resetPassword" autocomplete="new-password" required>
        <small class="field-help">Use at least 8 characters with letters and numbers.</small>
      </div>

      <div class="form-group">
        <label>Confirm new password</label>
        <input type="password" id="resetConfirmPassword" autocomplete="new-password" required>
      </div>

      <p id="resetMessage" class="form-message"></p>

      <button type="submit" class="auth-btn" id="resetPasswordBtn">Reset password</button>
    </form>
  </main>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
