<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sign Up - CV for U</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/cv.css">
  <link rel="stylesheet" href="css/auth.css">
</head>

<body class="auth-body">
  <div class="auth-card">
    <a href="index.html" class="auth-back">Back to home</a>
    <img src="images/logo.png" alt="CV for U" class="auth-logo">
    <p class="auth-eyebrow">CV for U</p>

    <h1>Create your account</h1>
    <p class="auth-sub">Save your CVs, keep your download credits, and log in anytime.</p>

    <form id="signupForm">
      <div class="form-group">
        <label>Full name</label>
        <input type="text" id="signupFullName" autocomplete="name" required>
      </div>

      <div class="form-group">
        <label>Username (optional)</label>
        <input type="text" id="signupUsername" autocomplete="username" placeholder="e.g. nomvula.d">
        <small class="field-help">You can log in with either your email or username.</small>
      </div>

      <div class="form-group">
        <label>Email address</label>
        <input type="email" id="signupEmail" autocomplete="email" required>
      </div>

      <div class="form-group">
        <label>Password</label>
        <input type="password" id="signupPassword" autocomplete="new-password" required>
        <small class="field-help">Use at least 8 characters with letters and numbers.</small>
      </div>

      <div class="form-group">
        <label>Confirm password</label>
        <input type="password" id="signupConfirmPassword" autocomplete="new-password" required>
      </div>

      <p id="signupError" class="form-message"></p>

      <button type="submit" class="auth-btn">Create account</button>
    </form>

    <p class="auth-footer">
      Already have an account?
      <a href="login.html">Log in</a>
    </p>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
